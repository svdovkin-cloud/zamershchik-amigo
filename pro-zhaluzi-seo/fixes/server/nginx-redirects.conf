# ============================================================================
# nginx — pro-zhaluzi.ru
# Текущее состояние (проверено): http→https и www→не-www работают (301 за 1 переход).
# ЭТО НУЖНО ДОБАВИТЬ/ПОЧИНИТЬ.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. Единый канонический хост — СКОРАЯ ПРОВЕРКА БЫСТРЕЕ (защита от дублей)
#    Обязательно строка default_server, иначе при неверном Host отдастся
#    случайный сайт из пула.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Полный канонический вид URL: без www, без завершающего слэша, без меток
    return 301 https://pro-zhaluzi.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    return 301 https://pro-zhaluzi.ru$request_uri;
}

# ---------------------------------------------------------------------------
# 2. Основной сервер
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pro-zhaluzi.ru www.pro-zhaluzi.ru;

    # 2.1 Принудительно HTTPS (301, без потери UTM-меток)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pro-zhaluzi.ru;

    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    root /var/www/pro-zhaluzi;
    index index.html;

    charset utf-8;

    # --- 2.2 Сжатие: добавить Brotli (сейчас только gzip) ---
    # Размер HTML главной: 2.96 МБ → 374 КБ (gzip) → ~285 КБ (brotli) и быстрее
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # brotli              on;
    # brotli_comp_level   5;
    # brotli_static       on;
    # brotli_types        text/plain text/css text/xml text/javascript
    #                     application/javascript application/json image/svg+xml;

    # --- 2.3 Заголовки безопасности (отсутствуют — добавить) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # --- 2.4 Кеширование статики ---
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- 2.5 HTML: НЕ кешировать надолго (иначе не подхватит правки) ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # --- 2.6 robots.txt и sitemap.xml — всегда свежие ---
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/xml;
    }

    # ---------------------------------------------------------------------------
    # 2.7 301-редиректы ПЕРЕИМЕНОВАННЫХ URL
    #     Выполнять ПОСЛЕ появления новых страниц, иначе будет 404.
    #     Применять только на 301, не на 302 — вес не передаётся через 302.
    # ---------------------------------------------------------------------------

    # ★ Консолидация дубля блэкаут
    rewrite ^/rulonnayz-shtora-blackout/?$  https://pro-zhaluzi.ru/rulonnye-shtory-blekaut  permanent;

    # ★ Шаблонный слаг
    rewrite ^/newpage/?$                   https://pro-zhaluzi.ru/zhaluzi-i-shtory-pod-zakaz  permanent;

    # ★ Английские слаги на русском сайте
    rewrite ^/stocks/?$                    https://pro-zhaluzi.ru/aktsii      permanent;
    rewrite ^/map/?$                       https://pro-zhaluzi.ru/karta-sayta permanent;

    # ★ Нечитаемые/безграмотные слаги
    rewrite ^/zhaluzi-shtory/?$            https://pro-zhaluzi.ru/zhalyuzi-ili-shtory permanent;
    rewrite ^/gorizontalnyezhaluzidlyapomeshcheniy/?$ https://pro-zhaluzi.ru/gorizontalnyye-zhalyuzi-dlya-pomeshcheniya permanent;

    # Нормализация завершающего слэша: /page/ → /page
    rewrite ^/(.+)/$   /$1 permanent;

    # 404 вместо мягких ответов
    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/pro-zhaluzi.access.log;
    error_log  /var/log/nginx/pro-zhaluzi.error.log;
}


# ---------------------------------------------------------------------------
# 3. CDN / статика (если отдаётся отдельным vhost)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m-files.cdn1.cc;

    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # Использовать AVIF/WebP через параметр формата
    location ~* \.(?:png|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # Если CDN умеет — отдавать по Accept:
        # avif "/path/to/[email protected]" f=avif;
        # webp "/path/to/[email protected]" f=webp;
    }
}