<!-- ═══════════════════════════════════════════════════════════════════════
     СПОСОБ А — ДИНАМИЧЕСКИЙ (вставить один раз, работает на всех страницах)
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  // 1. Канонический URL: всегда https, без слэша в конце (кроме главной), без query
  var u = new URL(window.location.href);
  u.protocol = 'https:';
  u.host = 'pro-zhaluzi.ru';          // принудительно убираем www
  u.search = '';                      // убираем ?utm_... и прочие метки
  u.hash = '';
  var path = u.pathname.replace(/\/+$/, '');
  if (path === '') path = '/';
  var canonical = 'https://pro-zhaluzi.ru' + path;

  // 2. Canonical — с ПРЯМЫМИ кавычками
  var oldCan = document.querySelector("link[rel='canonical']");
  if (oldCan) oldCan.parentNode.removeChild(oldCan);
  var can = document.createElement('link');
  can.rel = 'canonical';
  can.href = canonical;
  document.head.appendChild(can);

  // 3. og:url — абсолютный
  var og = document.querySelector("meta[property='og:url']");
  if (!og) {
    og = document.createElement('meta');
    og.setAttribute('property', 'og:url');
    document.head.appendChild(og);
  }
  og.setAttribute('content', canonical);

  // 4. lang на <html>
  document.documentElement.setAttribute('lang', 'ru-RU');

  // 5. viewport без ограничения масштаба
  var vp = document.querySelector("meta[name='viewport']");
  if (!vp) {
    vp = document.createElement('meta');
    vp.setAttribute('name', 'viewport');
    document.head.appendChild(vp);
  }
  vp.setAttribute('content', 'width=device-width, initial-scale=1.0');

  // 6. twitter:card — если нет
  if (!document.querySelector("meta[name='twitter:card']")) {
    var tw = document.createElement('meta');
    tw.setAttribute('name', 'twitter:card');
    tw.setAttribute('content', 'summary_large_image');
    document.head.appendChild(tw);
  }

  // 7. Автоматические BreadcrumbList — на всех страницах кроме главной
  var isHome = (path === '/');
  if (!isHome && !document.querySelector("script[data-seo-breadcrumbs]")) {
    var NAMES = {
      'gorizontalnyezhaluzikupit':      'Горизонтальные жалюзи',
      'gorizontalnyye-derevyannyye-zhalyuzi': 'Горизонтальные деревянные жалюзи',
      'gorizontalnyye-bambukovyye-zhalyuzi':  'Горизонтальные бамбуковые жалюзи',
      'gorizontalnyezhaluzidlyapomeshcheniy': 'Горизонтальные жалюзи для помещений',
      'vertikalnyezhaluzikupit':       'Вертикальные жалюзи',
      'zhalyuzi-vertikalnye-tkanevye': 'Вертикальные тканевые жалюзи',
      'rachelcurtains':                'Тюлевые жалюзи Rachel',
      'rulonnyeshtorykupit':           'Рулонные шторы',
      'rulonnye-shtory-blekaut':       'Рулонные шторы блэкаут',
      'rulonnayz-shtora-blackout':     'Рулонные шторы блэкаут',
      'rulonnye-shtory-dennoch':       'Рулонные шторы день-ночь',
      'kassetnye-rulonnye-shtory':     'Кассетные рулонные шторы',
      'zip':                           'Уличные рулонные шторы ZIP',
      'rimskieshtorykurit':            'Римские шторы',
      'shtoryplissekupit':             'Шторы плиссе',
      'automaticheskiezhaluzikupit':   'Автоматические жалюзи',
      'zhaluzi-dlya-kychni':           'Жалюзи для кухни',
      'zhalyuzi-dlya-ofisa':           'Жалюзи для офиса',
      'zhalyuzi-dlya-shkoly':          'Жалюзи для школы',
      'zhaluzi-shtory':                'Жалюзи или шторы',
      'newpage':                       'Жалюзи и шторы под заказ',
      'katalog-shtor':                 'Каталог штор',
      'about-us':                      'О компании',
      'diler':                         'Дилерам',
      'stocks':                        'Акции',
      'articles':                      'Статьи',
      'faq':                           'Вопросы и ответы',
      'reviews':                       'Отзывы',
      'contact':                       'Контакты',
      'dostavka-i-oplata':             'Доставка и оплата'
    };
    // Подкатегории, группируемые в хлебные крошки
    var CATALOG = [
      'gorizontalnyezhaluzikupit','gorizontalnyye-derevyannyye-zhalyuzi',
      'gorizontalnyye-bambukovyye-zhalyuzi','gorizontalnyezhaluzidlyapomeshcheniy',
      'vertikalnyezhaluzikupit','zhalyuzi-vertikalnye-tkanevye','rachelcurtains',
      'rulonnyeshtorykupit','rulonnye-shtory-blekaut','rulonnayz-shtora-blackout',
      'rulonnye-shtory-dennoch','kassetnye-rulonnye-shtory','zip',
      'rimskieshtorykurit','shtoryplissekupit','automaticheskiezhaluzikupit',
      'zhaluzi-dlya-kychni','zhalyuzi-dlya-ofisa','zhalyuzi-dlya-shkoly',
      'zhaluzi-shtory','newpage'
    ];

    var items = [{
      '@type': 'ListItem',
      'position': 1,
      'name': 'Главная',
      'item': 'https://pro-zhaluzi.ru/'
    }];
    var pos = 2;

    if (CATALOG.indexOf(path.slice(1)) !== -1) {
      items.push({
        '@type': 'ListItem', 'position': pos++, 'name': 'Каталог',
        'item': 'https://pro-zhaluzi.ru/katalog-shtor'
      });
    }
    items.push({
      '@type': 'ListItem', 'position': pos, 'name': NAMES[path.slice(1)] || document.title,
      'item': canonical
    });

    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.setAttribute('data-seo-breadcrumbs', '1');
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      'itemListElement': items
    });
    document.head.appendChild(ld);
  }
})();
</script>
