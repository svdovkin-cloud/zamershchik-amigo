<!-- ==========================================================================
     /contact — ContactPage + LocalBusiness (вытягивает карточку организации
     в Яндекс.Бизнес и Google Business Profile, показывает телефон и часы)
     ========================================================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "@id": "https://pro-zhaluzi.ru/contact#webpage",
  "url": "https://pro-zhaluzi.ru/contact",
  "name": "Контакты PRO Жалюзи в Самаре — адрес и телефон",
  "description": "Адрес, телефон, e-mail и режим работы производства жалюзи и штор PRO Жалюзи в Самаре.",
  "inLanguage": "ru-RU",
  "isPartOf": { "@id": "https://pro-zhaluzi.ru/#website" },
  "primaryImageOfPage": {
    "@type": "ImageObject",
    "url": "https://pro-zhaluzi.ru/og-image.jpg"
  },
  "about": { "@id": "https://pro-zhaluzi.ru/#organization" },
  "breadcrumb": {
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Главная", "item": "https://pro-zhaluzi.ru/" },
      { "@type": "ListItem", "position": 2, "name": "Контакты", "item": "https://pro-zhaluzi.ru/contact" }
    ]
  }
}
</script>


<!-- ==========================================================================

     ⚠ AggregateRating включать ТОЛЬКО если на странице реально видны
